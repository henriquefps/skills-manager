<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Apply the saved theme before first paint (no flash). Storage may be blocked: fall back to System. */
    try {
      var t = localStorage.getItem('skm-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <title>skm - Skills manager</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#list">Skip to skills</a>

  <div class="page">
    <header class="masthead">
      <div class="eyebrow"><span class="label">Skills manager</span><span class="rule"></span>
        <div class="theme" id="theme" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" aria-checked="true" tabindex="0" data-theme-value="system" aria-label="Theme: System" title="Theme: System"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-value="light" aria-label="Theme: Light" title="Theme: Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-value="dark" aria-label="Theme: Dark" title="Theme: Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        </div>
      </div>
      <h1 id="title">Skills</h1>
      <p class="deck" id="deck">Loading your skills.</p>
      <p class="cwd" id="cwd"></p>
      <div class="coststat" id="coststat" hidden></div>
      <div class="checkbar" id="checkbar" hidden>
        <button class="btn" type="button" id="check-btn" data-fk="check">Check for updates</button>
        <p class="check-meta" id="check-meta" aria-live="polite"></p>
      </div>
    </header>

    <section id="banner" class="banner" aria-live="polite" hidden></section>
    <section id="updates-banner" class="banner updates" aria-live="polite" hidden></section>

    <section class="toolbar" aria-label="Find skills">
      <div class="tabs" role="tablist" aria-label="Scope">
        <button class="tab" role="tab" id="tab-global" aria-controls="list" aria-selected="true" data-scope="global" type="button">Global <span class="count" id="count-global">0</span></button>
        <button class="tab" role="tab" id="tab-local" aria-controls="list" aria-selected="false" data-scope="local" type="button" tabindex="-1">Local <span class="count" id="count-local">0</span></button>
        <button class="tab" role="tab" id="tab-projects" aria-controls="list" aria-selected="false" data-scope="projects" type="button" tabindex="-1">Projects <span class="count" id="count-projects" hidden>0</span></button>
        <button class="tab" role="tab" id="tab-profiles" aria-controls="list" aria-selected="false" data-scope="profiles" type="button" tabindex="-1">Profiles <span class="count" id="count-profiles" hidden>0</span></button>
        <button class="tab" role="tab" id="tab-health" aria-controls="list" aria-selected="false" data-scope="health" type="button" tabindex="-1">Health <span class="count" id="count-health" hidden>0</span></button>
      </div>
      <div class="search">
        <label class="sr" for="search">Search skills by name, description or tag</label>
        <input id="search" type="search" placeholder="Search skills" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="sort" id="sort-box">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="name">Name</option>
          <option value="cost">Context cost (high to low)</option>
        </select>
        <button class="btn" type="button" id="select-toggle" aria-pressed="false" hidden>Select skills</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      <div class="tagbar" id="tagbar" role="group" aria-labelledby="tagbar-label" hidden></div>
      <datalist id="tag-suggest"></datalist>
    </section>

    <main id="list" class="list" role="tabpanel" aria-labelledby="tab-global" tabindex="-1"></main>

    <div id="actionbar" class="actionbar" role="region" aria-label="Selection actions" hidden></div>
  </div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>

  <dialog id="confirm" class="modal" aria-labelledby="confirm-title">
    <form method="dialog" id="confirm-form">
      <h2 id="confirm-title"></h2>
      <p id="confirm-lead" class="lead"></p>
      <div id="confirm-options" class="options"></div>
      <div id="confirm-extra" class="extra" aria-live="polite"></div>
      <div class="preview" aria-live="polite">
        <div class="preview-label">Planned changes</div>
        <div id="confirm-preview"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="confirm-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="confirm-ok" value="ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="results" class="modal" aria-labelledby="results-title"></dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
